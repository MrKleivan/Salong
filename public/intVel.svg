<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="FintVel horisontal logo">
  <title>FintVel Horisontal Logo</title>
  <desc>Ikon (øyelokk og vipper) til venstre og ordmerke til høyre. Farge arver via CSS currentColor.</desc>

  <!-- GROUP: Icon on the left -->
