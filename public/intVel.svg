    <path d="M0 65 Q130 -10 260 65 Q130 25 0 65Z" />
    <!-- Lash base subtle curve -->
    <path d="M18 128 C75 110, 185 105, 242 128 C205 122, 120 124, 18 128Z" />
    <!-- Lashes -->
    <g transform="translate(28,104)">
      <path d="M0 0 C6 14, 10 28, 7 48 C4 28, 2 14, 0 0 Z" />
      <g transform="translate(18,0)"><path d="M0 0 C6 16, 11 32, 7 54 C4 32, 2 16, 0 0 Z"/></g>
      <g transform="translate(36,-1) scale(1.1)"><path d="M0 0 C6 18, 11 36, 7 62 C4 36, 2 18, 0 0 Z"/></g>
      <g transform="translate(56,-2) scale(1.2)"><path d="M0 0 C6 20, 11 40, 7 68 C4 40, 2 20, 0 0 Z"/></g>
      <g transform="translate(78,-3) scale(1.3)"><path d="M0 0 C6 22, 11 44, 7 74 C4 44, 2 22, 0 0 Z"/></g>
      <g transform="translate(102,-3) scale(1.45)"><path d="M0 0 C6 24, 11 48, 7 82 C4 48, 2 24, 0 0 Z"/></g>
      <g transform="translate(128,-3) scale(1.55)"><path d="M0 0 C6 24, 11 48, 7 86 C4 48, 2 24, 0 0 Z"/></g>
      <g transform="translate(154,-3) scale(1.45)"><path d="M0 0 C6 24, 11 48, 7 82 C4 48, 2 24, 0 0 Z"/></g>
      <g transform="translate(178,-3) scale(1.3)"><path d="M0 0 C6 22, 11 44, 7 74 C4 44, 2 22, 0 0 Z"/></g>
      <g transform="translate(200,-2) scale(1.2)"><path d="M0 0 C6 20, 11 40, 7 68 C4 40, 2 20, 0 0 Z"/></g>
      <g transform="translate(220,-1) scale(1.1)"><path d="M0 0 C6 18, 11 36, 7 62 C4 36, 2 18, 0 0 Z"/></g>
      <g transform="translate(238,0)"><path d="M0 0 C6 16, 11 32, 7 54 C4 32, 2 16, 0 0 Z"/></g>
      <g transform="translate(256,0)"><path d="M0 0 C6 14, 10 28, 7 48 C4 28, 2 14, 0 0 Z"/></g>
    </g>
  </g>

  <!-- WORDMARK: aligned vertically center to the icon -->
  <text x="360" y="165"
        font-family="Playfair Display, 'Times New Roman', serif"
        font-size="120"
        letter-spacing="2"
